<!DOCTYPE html>
<!-- Pages Actions deploy check -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ltijs - A simple nodejs tool to facilitate the implementation of LTI providers and consumers.</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="A simple nodejs tool to facilitate the implementation of LTI providers and consumers.">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//unpkg.com/docsify/lib/themes/vue.css">
  <link rel="icon" href="./assets/favicon.ico">
  <style>
    .app-name img {
      height: 34px;
      width: auto;
      vertical-align: middle;
    }
    .app-name-link::after,
    .beta-badge {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 7px;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.6;
      vertical-align: middle;
      border-radius: 999px;
      background: #023e73;
      color: #fff;
    }
    .app-name-link::after {
      content: 'beta';
    }
    .home-beta-badge {
      vertical-align: top;
      margin-top: 12px;
      font-size: 13px;
      padding: 2px 10px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      repo: 'https://github.com/Cvmcosta/ltijs',
      auto2top: true,
      logo: './assets/logo.svg',
      name: 'ltijs',
      loadSidebar: true,
      subMaxLevel: 3,
      relativePath: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      }
    }
  </script>
  <script src="//unpkg.com/docsify/lib/docsify.min.js"></script>
  <script src="//unpkg.com/prismjs@1.30.0/components/prism-typescript.min.js"></script>
  <script src="//unpkg.com/prismjs@1.30.0/components/prism-bash.min.js"></script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs'
    mermaid.initialize({ startOnLoad: true })
    window.mermaid = mermaid
  </script>
  <script src="//unpkg.com/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>
</body>
</html>
