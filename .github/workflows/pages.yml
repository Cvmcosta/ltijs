name: Pages

# Runs the library's test+coverage gate for every push/PR touching website/, and publishes it to the live
# Pages site, gated to an actual push to master so a release branch or a PR can't overwrite what's live.

on:
  push:
    branches: [master, 'release/**']
    paths: ['website/**']
  pull_request:
    paths: ['website/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Run tests and coverage
        run: npm run test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage

      - uses: actions/configure-pages@v5

      - name: Upload docs site
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
